<!-- summer.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>summer</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 40px 16px;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: linear-gradient(135deg, #fff6d5 0%, #ffe0b8 40%, #ffd0d0 100%);
    color: #3a2b12;
  }

  h1 {
    margin: 0;
    font-size: 26px;
    letter-spacing: 4px;
    color: #b3541e;
    text-shadow: 1px 1px 0 #fff;
  }

  .desc {
    margin: 0;
    font-size: 15px;
    color: #7a5a2a;
    letter-spacing: 1px;
  }

  table {
    border-collapse: collapse;
    background: #fffdf6;
    box-shadow: 0 10px 30px rgba(150, 90, 20, .25);
    border-radius: 6px;
    overflow: hidden;
  }

  td {
    width: 62px;
    height: 54px;
    text-align: center;
    vertical-align: middle;
    font-size: 17px;
    font-variant-numeric: tabular-nums;
    border: 1px solid #e6cf9e;
    transition: background .15s;
  }

  td:hover { background: #fff3cf; }

  .center {
    background: linear-gradient(135deg, #ffd54f, #ffb300);
    color: #7a3b00;
    font-weight: 700;
    font-size: 19px;
    border: 2px solid #b3541e;
    box-shadow: inset 0 0 12px rgba(255, 255, 255, .7);
  }

  .neg { color: #c0392b; }

  
  .answer-input {
    margin-top: 6px;
    width: 84px;
    padding: 5px 8px;
    text-align: center;
    font-size: 14px;
    font-family: inherit;
    color: #8a6a3a;
    background: rgba(255, 255, 255, .45);
    border: 1px solid rgba(180, 140, 80, .35);
    border-radius: 5px;
    outline: none;
    opacity: .55;
    transition: opacity .2s, border-color .2s, background .2s;
  }

  .answer-input::placeholder { color: rgba(150, 120, 70, .5); }

  .answer-input:focus {
    opacity: 1;
    background: #fffdf6;
    border-color: #ffb300;
    box-shadow: 0 0 0 3px rgba(255, 213, 79, .35);
  }

  @media (max-width: 640px) {
    td { width: 36px; height: 34px; font-size: 12px; }
    .center { font-size: 12px; }
    h1 { font-size: 20px; }
  }
</style>
</head>
<body>

  <h1>方</h1>
  <p class="desc">每行、每列及两条主对角线之和相等，中心格为 x<sup>5</sup>，求 x 与幻和。</p>

  <table>
    <tr>
      <td>38</td><td>49</td><td>60</td><td>71</td>
      <td class="neg">-8</td><td>3</td><td>14</td><td>25</td><td>36</td>
    </tr>
    <tr>
      <td>48</td><td>59</td><td>70</td><td>0</td>
      <td>2</td><td>13</td><td>24</td><td>35</td><td>37</td>
    </tr>
    <tr>
      <td>58</td><td>69</td><td class="neg">-1</td><td>1</td>
      <td>12</td><td>23</td><td>34</td><td>45</td><td>47</td>
    </tr>
    <tr>
      <td>68</td><td class="neg">-2</td><td>9</td><td>11</td>
      <td>22</td><td>33</td><td>44</td><td>46</td><td>57</td>
    </tr>
    <tr>
      <td class="neg">-3</td><td>8</td><td>10</td><td>21</td>
      <td class="center">x<sup>5</sup></td>
      <td>43</td><td>54</td><td>56</td><td>67</td>
    </tr>
    <tr>
      <td>7</td><td>18</td><td>20</td><td>31</td>
      <td>42</td><td>53</td><td>55</td><td>66</td><td class="neg">-4</td>
    </tr>
    <tr>
      <td>17</td><td>19</td><td>30</td><td>41</td>
      <td>52</td><td>63</td><td>65</td><td class="neg">-5</td><td>6</td>
    </tr>
    <tr>
      <td>27</td><td>29</td><td>40</td><td>51</td>
      <td>62</td><td>64</td><td class="neg">-6</td><td>5</td><td>16</td>
    </tr>
    <tr>
      <td>28</td><td>39</td><td>50</td><td>61</td>
      <td>72</td><td class="neg">-7</td><td>4</td><td>15</td><td>26</td>
    </tr>
  </table>

  <input id="answer" class="answer-input" type="text" placeholder="·" autocomplete="off" spellcheck="false">

  <script>
    (function () {
      var input = document.getElementById('answer');
      var ANSWER = '288';

      function check() {
        if (input.value.trim() === ANSWER) {
          window.location.href = 'winter.html';
        }
      }

      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') check();
      });
      input.addEventListener('blur', check);
    })();
  </script>

</body>
</html>
